<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolicyPilot | Enterprise AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
body { background:#0a0a0f; color:#e5e7eb; display:flex; height:100vh; overflow:hidden; }
.sidebar { width:280px; background:#11111a; border-right:1px solid #222; padding:22px; display:flex; flex-direction:column; overflow-y:auto; }
.logo { display:flex; gap:12px; align-items:center; margin-bottom:18px; }
.logo-icon { width:42px; height:42px; background:linear-gradient(135deg,#8b5cf6,#3b82f6); border-radius:12px; display:grid; place-items:center; font-size:20px; }
.logo h1 { font-size:19px; }
.logo p { font-size:12px; color:#888; }
.new-chat { background:linear-gradient(135deg,#8b5cf6,#3b82f6); border:none; padding:13px; border-radius:12px; color:white; font-weight:600; cursor:pointer; margin-bottom:14px; }
.try { font-size:11px; letter-spacing:1px; color:#666; margin-bottom:12px; }
.q-btn { background:#1a1a27; border:1px solid #222; padding:12px 14px; border-radius:10px; color:#bbb; font-size:13px; text-align:left; cursor:pointer; margin-bottom:9px; width:100%; }
.q-btn:hover { background:#22223a; color:white; }
.main { flex:1; display:flex; flex-direction:column; background:radial-gradient(ellipse at top, #1a1033 0%, #0a0a0f 55%); }
.chat { flex:1; overflow-y:auto; padding:40px 30px; display:flex; flex-direction:column; gap:22px; }
.msg-row { display:flex; gap:14px; max-width:900px; width:100%; margin:0 auto; }
.msg-row.user { justify-content:flex-end; }
.bubble-user { background:linear-gradient(135deg,#8b5cf6,#6366f1); padding:14px 18px; border-radius:18px 18px 4px 18px; font-size:14px; }
.bubble-bot { background:#1a1a27; border:1px solid #2a2a40; padding:22px 24px; border-radius:18px 18px 18px 4px; width:100%; line-height:1.7; font-size:14px; }
.bubble-bot b { color:#a78bfa; }
.bubble-bot .bullet { margin:10px 0; padding-left:18px; position:relative; color:#d1d5db; }
.bullet::before { content:"•"; position:absolute; left:0; color:#8b5cf6; }
.bot-icon { width:38px; height:38px; background:#1f1f33; border:1px solid #333; border-radius:10px; display:grid; place-items:center; flex-shrink:0; }
.input-wrap { padding:18px 30px 28px; }
.input-box { max-width:900px; margin:0 auto; background:#1a1a27; border:1px solid #3b2f6b; border-radius:18px; display:flex; align-items:center; padding:6px 6px 6px 20px; }
.input-box input { flex:1; background:transparent; border:none; outline:none; color:white; font-size:14px; padding:12px 0; }
.input-box button { width:44px; height:44px; border-radius:12px; border:none; background:linear-gradient(135deg,#8b5cf6,#3b82f6); color:white; cursor:pointer; font-size:18px; }
.footer { font-size:11px; color:#555; margin-top:auto; padding-top:20px; }
.dot { width:8px; height:8px; background:#22c55e; border-radius:50%; display:inline-block; margin-right:6px; }
.avatar-wrap { background:#1a1a27; border:1px solid #2a2a40; border-radius:16px; padding:16px; text-align:center; margin:18px 0 20px; }
#hrAvatar { width:90px; height:90px; border-radius:50%; border:3px solid #8b5cf6; transition:0.3s; }
#hrAvatar.speaking { transform:scale(1.08); border-color:#22c55e; box-shadow:0 0 20px rgba(34,197,94,0.4); }
#avatarStatus { font-size:12px; color:#a78bfa; margin-top:8px; }
#wave { display:none; margin-top:6px; }
.wave-bar { display:inline-block; width:3px; height:14px; background:#22c55e; margin:0 1.5px; border-radius:3px; animation:wave 0.8s infinite; }
.wave-bar:nth-child(2){animation-delay:0.1s}.wave-bar:nth-child(3){animation-delay:0.2s}.wave-bar:nth-child(4){animation-delay:0.3s}
@keyframes wave{0%,100%{height:8px}50%{height:18px}}
.avatar-controls { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.ctrl { font-size:10px; background:#22223a; border:1px solid #333; color:#aaa; padding:5px 8px; border-radius:6px; cursor:pointer; }
.ctrl:hover{ color:#fff; border-color:#8b5cf6; }
.feedback-row { display:flex; gap:6px; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid #2a2a40; flex-wrap:wrap; }
.star { font-size:18px; cursor:pointer; color:#333; transition:0.2s; }
.star.active, .star:hover { color:#fbbf24; }
.feedback-input { background:#11111a; border:1px solid #333; border-radius:8px; padding:8px 10px; color:#fff; font-size:12px; flex:1; min-width:120px; margin-left:8px; }
</style>
</head>
<body>
<div class="sidebar">
<div class="logo"><div class="logo-icon">🤖</div><div><h1>PolicyPilot</h1><p>Enterprise v2.0</p></div></div>
<div class="avatar-wrap">
  <img id="hrAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Suvajit&backgroundColor=b6e3f4,c0aede,d1d4f9&clothing=blazerAndShirt" alt="HR Avatar">
  <div id="avatarStatus">HR Buddy • Click Enable Voice</div>
  <div id="wave">
    <span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span>
    <span style="font-size:10px;color:#22c55e;margin-left:4px">Speaking</span>
  </div>
  <div class="avatar-controls">
    <button class="ctrl" id="enableVoiceBtn" style="background:#22c55e;color:white;border:none;font-weight:600;padding:8px 14px;font-size:12px" onclick="enableVoice()">🔊 Enable Voice - Click First!</button>
    <button class="ctrl" onclick="replayLast()">🔊 Replay</button>
    <button class="ctrl" onclick="stopVoice()">⏹ Stop</button>
  </div>
</div>
<button class="new-chat" onclick="location.reload()">+ New Chat</button>
<div class="try">TRY ASKING</div>
<button class="q-btn" onclick="askQuick('What is the leave policy?')">🏖 What is the leave policy?</button>
<button class="q-btn" onclick="askQuick('What is WFH policy?')">🏠 What is WFH policy?</button>
<button class="q-btn" onclick="askQuick('What are working hours?')">⏰ What are working hours?</button>
<button class="q-btn" onclick="askQuick('How to claim reimbursement?')">💰 How to claim reimbursement?</button>
<button class="q-btn" onclick="askQuick('Explain performance review?')">🎯 Explain performance review?</button>
<div class="footer"><span class="dot"></span>AI Online • <a href="https://policy-pilot-8vpo.onrender.com/traction" target="_blank" style="color:#a78bfa">Traction 📊</a> • <a href="https://policy-pilot-8vpo.onrender.com/stats" target="_blank" style="color:#666">Stats</a><br><br>Built by Suvajit • RAG + Avatar</div>
</div>
<div class="main">
<div class="chat" id="chat">
<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot">Hi! I'm <b>PolicyPilot Avatar</b>. <b style="color:#22c55e">Step 1: Click green Enable Voice button first!</b> Then ask anything - I will auto-speak every answer without asterisks! 🔊</div></div>
</div>
<div class="input-wrap">
<div class="input-box">
<input id="q" type="text" placeholder="Ask anything about company policy..." onkeypress="if(event.key==='Enter') send()">
<button onclick="send()">➤</button>
</div>
</div>
</div>
<script>
let lastAnswerText = "";
let lastQuestionText = "";
let voiceEnabled = false;
let voicesLoaded = false;
const avatarImg = document.getElementById('hrAvatar');
const wave = document.getElementById('wave');
const statusEl = document.getElementById('avatarStatus');
const BACKEND_URL = window.location.hostname === 'policy-pilot-8vpo.onrender.com' ? '' : 'https://policy-pilot-8vpo.onrender.com';

function askQuick(t) { document.getElementById('q').value = t; send(); }

function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    voicesLoaded = true;
    console.log("Voices loaded:", voices.length);
  }
  return voices;
}

function enableVoice(){
  console.log("Enable voice clicked");
  voiceEnabled = true;
  window.speechSynthesis.cancel();
  
  // Load voices
  loadVoices();
  
  // Chrome requires user gesture - speak silent to unlock
  const unlock = new SpeechSynthesisUtterance("Voice enabled for HR Buddy");
  unlock.volume = 1;
  unlock.rate = 1;
  unlock.onend = () => {
    console.log("Voice unlocked");
    statusEl.innerText = "HR Buddy • Voice Enabled ✅ - Will auto-speak!";
    statusEl.style.color = "#22c55e";
    document.getElementById('enableVoiceBtn').innerText = "✅ Voice Enabled";
    document.getElementById('enableVoiceBtn').style.background = "#1a1a27";
    document.getElementById('enableVoiceBtn').style.color = "#22c55e";
  };
  
  const voices = loadVoices();
  if(voices.length > 0){
    const pref = voices.find(v => v.lang.includes('en-US')) || voices[0];
    if(pref) unlock.voice = pref;
  }
  
  window.speechSynthesis.speak(unlock);
}

function cleanForSpeech(text){
  let clean = text;
  // CRITICAL: Remove markdown that causes asterisk speech
  clean = clean.replace(/\*\*(.*?)\*\*/g, '$1'); // **bold** -> bold
  clean = clean.replace(/\*(.*?)\*/g, '$1'); // *italic* -> italic
  clean = clean.replace(/#/g, ''); // # headers
  clean = clean.replace(/✅/g, ''); // emoji
  clean = clean.replace(/•/g, ''); // bullets
  clean = clean.replace(/Details:/gi, '');
  clean = clean.replace(/Source:.*$/gim, '');
  clean = clean.replace(/\(.*?\)/g, ''); // remove (pro-rata if you joined...)
  clean = clean.replace(/\n+/g, '. ');
  clean = clean.replace(/\s+/g, ' ');
  clean = clean.trim().substring(0, 500);
  // Final safety: remove any remaining * 
  clean = clean.replace(/\*/g, '');
  return clean;
}

function formatAnswerForDisplay(text){
  let ans = text;
  // Convert **bold** to purple bold
  ans = ans.replace(/\*\*(.*?)\*\*/g, '<b style="color:#a78bfa">$1</b>');
  // Remove leftover *
  ans = ans.replace(/\*/g, '');
  ans = ans.replace(/Details:/g, '<br><b style="color:#fff;margin-top:12px;display:block">Details:</b>');
  ans = ans.replace(/Source:.*/g, '<br><br><small style="color:#666">$&</small>');
  ans = ans.split('•').map((p,i) => i===0 ? p : `<div class="bullet">${p.trim()}</div>`).join('');
  ans = ans.replace(/\n/g, '<br>');
  return ans;
}

function speakAnswer(text) {
  if(!voiceEnabled){
    console.log("Voice not enabled, enabling now");
    enableVoice();
    // Wait 500ms for unlock then speak
    setTimeout(() => speakAnswer(text), 600);
    return;
  }
  
  window.speechSynthesis.cancel();
  lastAnswerText = text;
  
  let cleanText = cleanForSpeech(text);
  console.log("Speaking:", cleanText.substring(0,80));
  
  if(!cleanText || cleanText.length < 5){
    console.log("Clean text too short, not speaking");
    return;
  }
  
  avatarImg.classList.add('speaking');
  wave.style.display = "block";
  statusEl.innerText = "Speaking... 🔊";
  statusEl.style.color = "#22c55e";

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.volume = 1;
  utterance.rate = 0.9;
  utterance.pitch = 1;
  utterance.lang = 'en-US';
  
  let voices = loadVoices();
  if(voices.length > 0){
    let pref = voices.find(v => v.name.includes('Google') && v.lang.includes('en-US')) || voices.find(v => v.lang.includes('en-US')) || voices.find(v => v.lang.includes('en')) || voices[0];
    if(pref){
      utterance.voice = pref;
      console.log("Using voice:", pref.name);
    }
  }

  utterance.onstart = () => console.log("Speech started");
  utterance.onend = () => {
    console.log("Speech ended");
    avatarImg.classList.remove('speaking');
    wave.style.display = "none";
    statusEl.innerText = "HR Buddy • Ready ✅ - Auto-speaks";
    statusEl.style.color = "#a78bfa";
  };
  utterance.onerror = (e) => {
    console.error("Speech error:", e.error);
    avatarImg.classList.remove('speaking');
    wave.style.display = "none";
    statusEl.innerText = "Click Replay to speak";
    // Don't show error alert, just log
  };
  
  window.speechSynthesis.speak(utterance);
  // Chrome bug fix
  setTimeout(()=>{ window.speechSynthesis.resume(); }, 150);
}

function stopVoice(){ window.speechSynthesis.cancel(); avatarImg.classList.remove('speaking'); wave.style.display="none"; statusEl.innerText="Stopped - Click Replay"; }
function replayLast(){ 
  if(!lastAnswerText){ alert("Ask a question first!"); return; }
  console.log("Replay:", lastAnswerText.substring(0,30));
  speakAnswer(lastAnswerText); 
}

function setRating(n, el) {
  const stars = el.parentElement.querySelectorAll('.star');
  stars.forEach((s,i)=>{ s.classList.toggle('active', i < n); });
  el.parentElement.dataset.rating = n;
}

async function submitFeedback(btn) {
  const row = btn.parentElement;
  const rating = parseInt(row.dataset.rating || "0");
  const commentInput = row.querySelector('.feedback-input');
  const comment = commentInput ? commentInput.value : "";
  if(!rating){ alert("Please select stars ⭐"); return; }
  btn.innerText = "Thanks!"; btn.disabled = true;
  try {
    await fetch(BACKEND_URL + '/feedback', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rating: rating, comment: comment, question: lastQuestionText})
    });
    row.innerHTML = `<div style="color:#22c55e;font-size:12px">✅ Thanks! Rated ${rating}⭐</div>`;
  } catch(e){
    row.innerHTML = `<div style="color:#ff7b7b;font-size:12px">Error</div>`;
  }
}

async function send() {
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question) return;
  const chat = document.getElementById('chat');
  lastQuestionText = question;
  
  // Auto-enable voice on first question if not enabled
  if(!voiceEnabled){
    enableVoice();
  }
  
  chat.innerHTML += `<div class="msg-row user"><div class="bubble-user">${question}</div><div class="bot-icon" style="background:#8b5cf6">👤</div></div>`;
  input.value = '';
  const id = 'typing-'+Date.now();
  chat.innerHTML += `<div class="msg-row" id="${id}"><div class="bot-icon">🤖</div><div class="bubble-bot">Thinking...</div></div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch(BACKEND_URL + '/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: question})
    });
    const data = await res.json();
    document.getElementById(id).remove();
    
    let formatted = formatAnswerForDisplay(data.answer);

    const feedbackHtml = `
      <div class="feedback-row" data-rating="0">
        <span style="font-size:11px;color:#888">Rate:</span>
        <span class="star" onclick="setRating(1,this)">★</span>
        <span class="star" onclick="setRating(2,this)">★</span>
        <span class="star" onclick="setRating(3,this)">★</span>
        <span class="star" onclick="setRating(4,this)">★</span>
        <span class="star" onclick="setRating(5,this)">★</span>
        <input class="feedback-input" placeholder="Comment (optional)" />
        <button class="ctrl" style="background:#8b5cf6;color:white;border:none;padding:6px 12px" onclick="submitFeedback(this)">Submit</button>
      </div>
    `;

    chat.innerHTML += `<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot">${formatted} <br><br><button class="ctrl" style="margin-top:8px" onclick="replayLast()">🔊 Replay Voice</button>${feedbackHtml}</div></div>`;
    
    // Auto-speak after 400ms
    setTimeout(()=>{ 
      speakAnswer(data.answer); 
    }, 400);

  } catch (e) {
    document.getElementById(id).remove();
    chat.innerHTML += `<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot" style="color:#ff7b7b">Error: ${e.message}</div></div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}

// Preload voices
window.speechSynthesis.onvoiceschanged = () => { 
  loadVoices();
  console.log("Voices changed, loaded:", voicesLoaded);
};
window.addEventListener('load', () => {
  loadVoices();
  setTimeout(loadVoices, 500);
});
</script>
</body>
</html>
