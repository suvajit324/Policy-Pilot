<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolicyPilot | Enterprise AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
body { background:#0a0a0f; color:#e5e7eb; display:flex; height:100vh; overflow:hidden; }
.sidebar { width:280px; background:#11111a; border-right:1px solid #222; padding:22px; display:flex; flex-direction:column; }
.logo { display:flex; gap:12px; align-items:center; margin-bottom:28px; }
.logo-icon { width:42px; height:42px; background:linear-gradient(135deg,#8b5cf6,#3b82f6); border-radius:12px; display:grid; place-items:center; font-size:20px; }
.logo h1 { font-size:19px; }
.logo p { font-size:12px; color:#888; }
.new-chat { background:linear-gradient(135deg,#8b5cf6,#3b82f6); border:none; padding:13px; border-radius:12px; color:white; font-weight:600; cursor:pointer; margin-bottom:24px; }
.try { font-size:11px; letter-spacing:1px; color:#666; margin-bottom:12px; }
.q-btn { background:#1a1a27; border:1px solid #222; padding:12px 14px; border-radius:10px; color:#bbb; font-size:13px; text-align:left; cursor:pointer; margin-bottom:9px; width:100%; }
.q-btn:hover { background:#22223a; color:white; }
.main { flex:1; display:flex; flex-direction:column; background:radial-gradient(ellipse at top, #1a1033 0%, #0a0a0f 55%); }
.chat { flex:1; overflow-y:auto; padding:40px 30px; display:flex; flex-direction:column; gap:22px; }
.msg-row { display:flex; gap:14px; max-width:900px; width:100%; margin:0 auto; }
.msg-row.user { justify-content:flex-end; }
.bubble-user { background:linear-gradient(135deg,#8b5cf6,#6366f1); padding:14px 18px; border-radius:18px 18px 4px 18px; font-size:14px; }
.bubble-bot { background:#1a1a27; border:1px solid #2a2a40; padding:22px 24px; border-radius:18px 18px 18px 4px; width:100%; line-height:1.7; font-size:14px; }
.bubble-bot b { color:#a78bfa; }
.bubble-bot .bullet { margin:10px 0; padding-left:18px; position:relative; color:#d1d5db; }
.bullet::before { content:"•"; position:absolute; left:0; color:#8b5cf6; }
.bot-icon { width:38px; height:38px; background:#1f1f33; border:1px solid #333; border-radius:10px; display:grid; place-items:center; flex-shrink:0; }
.input-wrap { padding:18px 30px 28px; }
.input-box { max-width:900px; margin:0 auto; background:#1a1a27; border:1px solid #3b2f6b; border-radius:18px; display:flex; align-items:center; padding:6px 6px 6px 20px; }
.input-box input { flex:1; background:transparent; border:none; outline:none; color:white; font-size:14px; padding:12px 0; }
.input-box button { width:44px; height:44px; border-radius:12px; border:none; background:linear-gradient(135deg,#8b5cf6,#3b82f6); color:white; cursor:pointer; font-size:18px; }
.footer { font-size:11px; color:#555; margin-top:auto; padding-top:20px; }
.dot { width:8px; height:8px; background:#22c55e; border-radius:50%; display:inline-block; margin-right:6px; }
</style>
</head>
<body>
<div class="sidebar">
<div class="logo"><div class="logo-icon">🤖</div><div><h1>PolicyPilot</h1><p>Enterprise v2.0</p></div></div>
<button class="new-chat" onclick="location.reload()">+ New Chat</button>
<div class="try">TRY ASKING</div>
<button class="q-btn" onclick="askQuick('What is the leave policy?')">🏖️ What is the leave policy?</button>
<button class="q-btn" onclick="askQuick('What is WFH policy?')">🏠 What is WFH policy?</button>
<button class="q-btn" onclick="askQuick('What are working hours?')">⏰ What are working hours?</button>
<button class="q-btn" onclick="askQuick('How to claim reimbursement?')">💰 How to claim reimbursement?</button>
<button class="q-btn" onclick="askQuick('Explain performance review?')">🎯 Explain performance review?</button>
<div class="footer"><span class="dot"></span>AI Online • 2 docs • 32 chunks<br><br>Built by Suvajit • RAG + Guardrails</div>
</div>
<div class="main">
<div class="chat" id="chat">
<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot">Hi! I'm <b>PolicyPilot</b>. Ask me anything about company policy — working hours, leave, WFH, reimbursement... I give structured, relevant answers from your 2 documents. 🛡️</div></div>
</div>
<div class="input-wrap">
<div class="input-box">
<input id="q" type="text" placeholder="Ask anything about company policy..." onkeypress="if(event.key==='Enter') send()">
<button onclick="send()">➤</button>
</div>
</div>
</div>
<script>
function askQuick(t) { document.getElementById('q').value = t; send(); }

async function send() {
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question) return;
  const chat = document.getElementById('chat');
  
  chat.innerHTML += `<div class="msg-row user"><div class="bubble-user">${question}</div><div class="bot-icon" style="background:#8b5cf6">👤</div></div>`;
  input.value = '';
  const id = 'typing-'+Date.now();
  chat.innerHTML += `<div class="msg-row" id="${id}"><div class="bot-icon">🤖</div><div class="bubble-bot">Thinking...</div></div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: question})
    });
    const data = await res.json();
    document.getElementById(id).remove();
    
    // PROPER FORMATTING - no raw ### or messy bullets
    let ans = data.answer;
    ans = ans.replace(/✅ Answer for:.*?\n\n/, '<b style="color:#a78bfa;font-size:15px">✅ Answer</b><br><br>');
    ans = ans.replace(/Details:/g, '<br><b style="color:#fff;margin-top:12px;display:block">Details:</b>');
    ans = ans.replace(/Source:.*/g, '<br><br><small style="color:#666">$&</small>');
    // Turn • into styled bullets
    ans = ans.split('•').map((p,i) => i===0 ? p : `<div class="bullet">${p.trim()}</div>`).join('');
    ans = ans.replace(/\n/g, '<br>');

    chat.innerHTML += `<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot">${ans}</div></div>`;
  } catch (e) {
    document.getElementById(id).remove();
    chat.innerHTML += `<div class="msg-row"><div class="bot-icon">🤖</div><div class="bubble-bot" style="color:#ff7b7b">Error: Backend not running on 8000. Keep that terminal open! ${e}</div></div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
